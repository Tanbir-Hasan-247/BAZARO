<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="bazLogoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77A" />
      <stop offset="45%" stop-color="#C59B4B" />
      <stop offset="100%" stop-color="#9E7833" />
    </linearGradient>
  </defs>

  <!-- Left Emblem (Height 64, Center x=40, y=40) -->
  <g transform="translate(4, 8)">
    <circle cx="32" cy="32" r="28" stroke="url(#bazLogoGold)" stroke-width="2" />
    <circle cx="32" cy="32" r="25" stroke="url(#bazLogoGold)" stroke-width="0.8" stroke-opacity="0.7" />
    <!-- Diamonds -->
    <polygon points="32,2 34,4 32,6 30,4" fill="url(#bazLogoGold)" />
    <polygon points="32,58 34,60 32,62 30,60" fill="url(#bazLogoGold)" />
    <!-- Arch -->
    <path d="M22 46 V27 C22 21 26 17 32 17 C38 17 42 21 42 27 V46" 
          stroke="url(#bazLogoGold)" stroke-width="1.2" stroke-linecap="round" />
    <!-- Letter B -->
    <text x="32" y="38" 
          font-family="'Playfair Display', Georgia, serif" 
          font-size="22" 
          font-weight="700" 
          fill="url(#bazLogoGold)" 
          text-anchor="middle" 
          dominant-baseline="central">B</text>
  </g>

  <!-- Wordmark BAZARO -->
  <text x="80" y="44" 
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif" 
        font-size="30" 
        font-weight="900" 
        letter-spacing="5" 
        fill="#1F1916">BAZARO</text>

  <!-- Tagline APNAR DESHER BAZAAR -->
  <text x="82" y="60" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="7.5" 
        font-weight="700" 
        letter-spacing="2.8" 
        fill="#9C7E54">APNAR DESHER BAZAAR</text>
</svg>
