<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bazaroGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DC9B" />
      <stop offset="50%" stop-color="#C59B4B" />
      <stop offset="100%" stop-color="#9A722B" />
    </linearGradient>
    <linearGradient id="bazaroObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1410" />
      <stop offset="100%" stop-color="#0D0A08" />
    </linearGradient>
  </defs>

  <!-- Obsidian Medallion Background -->
  <rect width="64" height="64" rx="18" fill="url(#bazaroObsidian)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#bazaroGold)" stroke-width="1.5" stroke-opacity="0.65" />

  <!-- Concentric Royal Crest Circle & Arch -->
  <circle cx="32" cy="32" r="22" stroke="url(#bazaroGold)" stroke-width="2" />
  <path d="M21 44V28C21 19.5 26 14 32 12C38 14 43 19.5 43 28V44" stroke="url(#bazaroGold)" stroke-width="1.6" stroke-linecap="round" />

  <!-- Top & Bottom Diamond Accents -->
  <polygon points="32,6 35,10 32,14 29,10" fill="url(#bazaroGold)" />
  <polygon points="32,50 35,54 32,58 29,54" fill="url(#bazaroGold)" />

  <!-- Bold Serif Monogram B -->
  <text x="32" y="40" text-anchor="middle" fill="url(#bazaroGold)" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="25">B</text>
</svg>
